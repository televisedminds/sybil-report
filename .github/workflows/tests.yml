name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: End-to-end offline demo
        run: |
          python -m autopilot demo --report reports/ci-demo.html
          test -s reports/ci-demo.html
      - name: Paper loop smoke test (synthetic data)
        run: |
          cat > /tmp/ci-paper.json <<'EOF'
          {
            "mode": "paper", "symbol": "X-USD", "timeframe": "1d",
            "source": "synthetic",
            "strategy": {"name": "dca", "params": {"every": 1, "trend_sma": 0}},
            "paper": {"poll_seconds": 1, "state_db": "/tmp/ci-paper.db"},
            "dashboard": {"enabled": false}
          }
          EOF
          python -m autopilot paper --config /tmp/ci-paper.json --iterations 2
          python -m autopilot status --state /tmp/ci-paper.db
